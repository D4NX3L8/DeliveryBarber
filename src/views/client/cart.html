<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrito | DeliveryBarber</title>
    <link rel="stylesheet" href="/public/css/global.css" />
    <link rel="stylesheet" href="/public/css/navbar.css" />
    <link rel="stylesheet" href="/public/css/footer.css" />
    <link rel="stylesheet" href="/public/css/client/cart.css" />
    <!-- Esto es para las alertas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
  </head>
  <body>
    <header id="navbar"></header>
    <main class="section">
      <div class="container">
        <div class="flex-between" style="align-items:flex-end; gap:1rem; flex-wrap:wrap; margin-bottom:1.75rem;">
          <div>
            <p class="page-note">Revisa tus productos seleccionados</p>
            <h1 class="page-title">Carrito</h1>
          </div>
        </div>
        <div class="cart-panel">
          <div id="cartContainer"></div>
          <div class="cart-total-bar card">
            <div>
              <h2>Total</h2>
              <span id="cartTotal">$0</span>
            </div>
            <button id="checkoutBtn" class="btn btn-primary">Finalizar Compra</button>
          </div>
        </div>
      </div>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="../../../public/js/components/navbar.js"></script>
    <script src="../../../public/js/components/hamburger.js"></script>
    <script type="module" src="../../../public/js/components/footer.js"></script>
    <script type="module" src="../../../public/js/client/cart.js"></script>
    <!-- Esto es para las alertas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
