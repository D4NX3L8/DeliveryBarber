<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Citas | DeliveryBarber</title>
    <link rel="stylesheet" href="/public/css/global.css" />
    <link rel="stylesheet" href="/public/css/navbar.css" />
    <link rel="stylesheet" href="/public/css/footer.css" />
    <link rel="stylesheet" href="/public/css/client/appointments.css" />
    <!-- Esto es para las alertas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
  </head>
  <body>
    <header id="navbar"></header>
    <main class="section">
      <div class="container">
        <div class="flex-between" style="align-items:flex-end; gap:1rem; flex-wrap:wrap; margin-bottom:1.75rem;">
          <div>
            <p class="page-note">Reserva tu servicio</p>
            <h1 class="page-title">Agendar Cita</h1>
          </div>
        </div>
        <form id="appointmentForm" class="appointment-form card">
          <input type="text" id="service" placeholder="Servicio" required />
          <div class="form-group">
            <label for="barber">Barbero</label>
            <select id="barber" required></select>
          </div>
          <div class="flex" style="gap:1rem; flex-wrap:wrap;">
            <div class="form-group" style="flex:1; min-width:180px;">
              <label for="date">Fecha</label>
              <input type="date" id="date" required />
            </div>
            <div class="form-group" style="flex:1; min-width:180px;">
              <label for="time">Hora</label>
              <select id="time" required>
                <option value="">Selecciona barbero y fecha</option>
              </select>
            </div>
          </div>
          <input type="text" id="address" placeholder="Dirección" required />
          <button type="submit" class="btn btn-primary">Agendar</button>
        </form>
        <section id="appointmentHistory" style="margin-top:2rem;">
          <h2 class="section-title">Historial de Citas</h2>
          <div class="form-group">
            <label for="appointmentFilter">Filtrar por estado</label>
            <select id="appointmentFilter">
              <option value="all">Todas</option>
              <option value="pending">Pendientes</option>
              <option value="accepted">Aceptadas</option>
              <option value="rejected">Rechazadas</option>
              <option value="completed">Completadas</option>
              <option value="cancelled">Canceladas</option>
            </select>
          </div>
          <div id="appointmentHistoryContainer"></div>
        </section>
      </div>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="../../../public/js/components/navbar.js"></script>
    <script src="../../../public/js/components/hamburger.js"></script>
    <script type="module" src="../../../public/js/components/footer.js"></script>
    <script type="module" src="../../../public/js/client/appointments.js"></script>
    <!-- Esto es para las alertas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
