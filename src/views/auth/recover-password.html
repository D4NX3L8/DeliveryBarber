<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Contraseña | DeliveryBarber</title>
    <link rel="stylesheet" href="/public/css/global.css" />
    <link rel="stylesheet" href="/public/css/navbar.css" />
    <link rel="stylesheet" href="/public/css/footer.css" />
    <link rel="stylesheet" href="/public/css/auth/recover-password.css" />
    <!-- Esto es para las alertas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
  </head>
  <body>
    <header id="navbar"></header>
    <main class="auth-page">
      <div class="auth-card card">
        <div>
          <h1>Recuperar Contraseña</h1>
          <p class="page-note">Introduce tu correo y te enviaremos un enlace para recuperar el acceso.</p>
        </div>
        <form id="recoverForm">
          <div class="form-group">
            <label for="recover-email">Correo</label>
            <input type="email" id="recover-email" placeholder="Correo" required />
          </div>
          <button type="submit" class="btn btn-primary">Enviar enlace</button>
        </form>
        <div class="auth-actions">
          <a href="login.html">Volver al inicio de sesión</a>
        </div>
      </div>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="../../../public/js/components/navbar.js"></script>
    <script src="../../../public/js/components/hamburger.js"></script>
    <script type="module" src="../../../public/js/components/footer.js"></script>
    <script type="module" src="../../../public/js/auth/recover-password.js"></script>
    <!-- Esto es para las alertas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
