<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión | DeliveryBarber</title>
    <link rel="stylesheet" href="/public/css/global.css" />
    <link rel="stylesheet" href="/public/css/navbar.css" />
    <link rel="stylesheet" href="/public/css/footer.css" />
    <link rel="stylesheet" href="/public/css/auth/login.css" />
    <!-- Esto es para las alertas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
  </head>
  <body>
    <main class="auth-page">
      <div class="auth-card card">
        <div>
          <h1>Iniciar Sesión</h1>
          <p class="page-note">Accede a tu cuenta para gestionar tus servicios y pedidos.</p>
        </div>
        <form id="loginForm">
          <div class="form-group">
            <label for="email">Correo</label>
            <input type="email" id="email" placeholder="Correo" required />
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Contraseña" required />
          </div>
          <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
        </form>
        <div class="auth-actions">
          <a href="register.html">Crear cuenta</a>
          <a href="/src/views/public/home.html">Continuar como invitado</a>
          <a href="recover-password.html">¿Olvidaste tu contraseña?</a>
        </div>
      </div>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="../../../public/js/components/footer.js"></script>
    <script type="module" src="../../../public/js/auth/login.js"></script>
    <!-- Esto es para las alertas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
