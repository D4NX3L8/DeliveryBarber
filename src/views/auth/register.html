<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro | DeliveryBarber</title>
    <link rel="stylesheet" href="/public/css/global.css" />
    <link rel="stylesheet" href="/public/css/navbar.css" />
    <link rel="stylesheet" href="/public/css/footer.css" />
    <link rel="stylesheet" href="/public/css/auth/register.css" />
    <!-- Esto es para las alertas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
  </head>
  <body>
    <main class="auth-page">
      <div class="auth-card card">
        <div>
          <h1>Registro</h1>
          <p class="page-note">Crea tu cuenta para comenzar a agendar servicios.</p>
        </div>
        <form id="registerForm">
          <div class="form-group">
            <label for="name">Nombre</label>
            <input type="text" id="name" placeholder="Nombre" required />
          </div>
          <div class="form-group">
            <label for="email">Correo</label>
            <input type="email" id="email" placeholder="Correo" required />
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Contraseña" required />
          </div>
          <button type="submit" class="btn btn-primary">Registrarse</button>
        </form>
        <div class="auth-actions">
          <a href="login.html">Ya tengo una cuenta</a>
        </div>
      </div>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="../../../public/js/components/footer.js"></script>
    <script type="module" src="../../../public/js/auth/register.js"></script>
    <!-- Esto es para las alertas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
