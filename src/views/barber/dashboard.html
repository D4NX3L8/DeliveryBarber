<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Barbero | DeliveryBarber</title>
    <link rel="stylesheet" href="/public/css/global.css" />
    <link rel="stylesheet" href="/public/css/navbar.css" />
    <link rel="stylesheet" href="/public/css/footer.css" />
    <link rel="stylesheet" href="/public/css/barber/dashboard.css" />
    <!-- Esto es para las alertas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
  </head>
  <body>
    <header id="navbar"></header>
    <main class="section">
      <div class="container">
        <div class="flex-between" style="align-items:flex-end; gap:1rem; flex-wrap:wrap; margin-bottom:1.75rem;">
          <div>
            <p class="page-note">Panel del barbero</p>
            <h1 class="page-title">Dashboard Barbero</h1>
          </div>
        </div>
        <div class="barber-summary">
          <article class="stats-card card"><h2>Total de citas</h2><p id="appointmentsCount"></p></article>
          <article class="stats-card card"><h2>Pendientes</h2><p id="pendingCount"></p></article>
          <article class="stats-card card"><h2>Completadas</h2><p id="completedCount"></p></article>
        </div>
      </div>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="../../../public/js/components/navbar.js"></script>
    <script type="module" src="../../../public/js/components/footer.js"></script>
    <script type="module" src="../../../public/js/barber/dashboard.js"></script>
    <script type="module" src="../../middleware/auth.js"></script>
    <script type="module" src="../../middleware/barber.js"></script>
    <script type="module" src="../../../public/js/guards/auth-guard.js"></script>
    <script type="module" src="../../../public/js/guards/barber-guard.js"></script>
    <!-- Esto es para las alertas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
