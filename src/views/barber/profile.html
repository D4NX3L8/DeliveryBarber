<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil Barbero | DeliveryBarber</title>
    <link rel="stylesheet" href="/public/css/global.css" />
    <link rel="stylesheet" href="/public/css/navbar.css" />
    <link rel="stylesheet" href="/public/css/footer.css" />
    <link rel="stylesheet" href="/public/css/barber/profile.css" />
    <!-- Esto es para las alertas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
  </head>
  <body>
    <header id="navbar"></header>
    <main class="section">
      <div class="container">
        <div class="flex-between" style="align-items:flex-end; gap:1rem; flex-wrap:wrap; margin-bottom:1.75rem;">
          <div>
            <p class="page-note">Actualiza tu información profesional</p>
            <h1 class="page-title">Mi Perfil</h1>
          </div>
        </div>
        <div class="profile-card card">
          <div class="form-group">
            <label for="barber-name">Nombre</label>
            <input type="text" id="barber-name" placeholder="Nombre completo" />
          </div>
          <div class="form-group">
            <label for="barber-experience">Experiencia</label>
            <textarea id="barber-experience" placeholder="Describe tu experiencia"></textarea>
          </div>
          <button class="btn btn-primary" type="button">Guardar cambios</button>
        </div>
      </div>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="../../../public/js/components/navbar.js"></script>
    <script src="../../../public/js/components/hamburger.js"></script>
    <script type="module" src="../../../public/js/components/footer.js"></script>
    <script type="module" src="../../../public/js/barber/profile.js"></script>
    <!-- Esto es para las alertas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
