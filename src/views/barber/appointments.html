<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Citas Barbero | DeliveryBarber</title>
    <link rel="stylesheet" href="/public/css/global.css" />
    <link rel="stylesheet" href="/public/css/navbar.css" />
    <link rel="stylesheet" href="/public/css/footer.css" />
    <link rel="stylesheet" href="/public/css/barber/appointments.css" />
    <!-- Esto es para las alertas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
  </head>
  <body>
    <header id="navbar"></header>
    <main class="section barber-appointments">
      <div class="container">
        <div class="flex-between" style="align-items:flex-end; gap:1rem; flex-wrap:wrap; margin-bottom:1.75rem;">
          <div>
            <p class="page-note">Administra tu agenda</p>
            <h1 class="page-title">Gestión de Citas</h1>
          </div>
        </div>
        <div class="form-group">
          <label for="appointmentFilter">Filtrar por estado</label>
          <select id="appointmentFilter">
            <option value="all">Todas</option>
            <option value="pending">Pendientes</option>
            <option value="accepted">Aceptadas</option>
            <option value="rejected">Rechazadas</option>
            <option value="completed">Completadas</option>
          </select>
        </div>
        <div id="appointmentsContainer"></div>
      </div>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="../../../public/js/components/navbar.js"></script>
    <script src="../../../public/js/components/hamburger.js"></script>
    <script type="module" src="../../../public/js/components/footer.js"></script>
    <script type="module" src="../../../public/js/barber/appointments.js"></script>
    <!-- Esto es para las alertas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
