<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estadísticas | DeliveryBarber</title>
    <link rel="stylesheet" href="/public/css/global.css" />
    <link rel="stylesheet" href="/public/css/navbar.css" />
    <link rel="stylesheet" href="/public/css/footer.css" />
    <link rel="stylesheet" href="/public/css/admin/statistics.css" />
    <!-- Esto es para las alertas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
  </head>
  <body>
    <header id="navbar"></header>
    <main class="section">
      <div class="container">
        <div class="flex-between" style="align-items:flex-end; gap:1rem; flex-wrap:wrap; margin-bottom:1.75rem;">
          <div>
            <p class="page-note">Resumen de datos</p>
            <h1 class="page-title">Estadísticas del Sistema</h1>
          </div>
        </div>
        <div class="stats-grid">
          <article class="stats-card card"><h2>Total Usuarios</h2><p id="totalUsers"></p></article>
          <article class="stats-card card"><h2>Clientes</h2><p id="totalClients"></p></article>
          <article class="stats-card card"><h2>Barberos</h2><p id="totalBarbers"></p></article>
          <article class="stats-card card"><h2>Total Citas</h2><p id="totalAppointments"></p></article>
          <article class="stats-card card"><h2>Pendientes</h2><p id="pendingAppointments"></p></article>
          <article class="stats-card card"><h2>Aceptadas</h2><p id="acceptedAppointments"></p></article>
          <article class="stats-card card"><h2>Completadas</h2><p id="completedAppointments"></p></article>
          <article class="stats-card card"><h2>Canceladas</h2><p id="cancelledAppointments"></p></article>
        </div>
      </div>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="../../../public/js/components/navbar.js"></script>
    <script type="module" src="../../../public/js/components/footer.js"></script>
    <script type="module" src="../../../public/js/admin/statistics.js"></script>
    <!-- Esto es para las alertas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
